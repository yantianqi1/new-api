services:
  new-api:
    image: ${NEW_API_IMAGE}
    container_name: new-api-preview
    restart: unless-stopped
    stop_grace_period: 150s
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "3002:3000"
    command: ["--log-dir", "/app/logs"]
    environment:
      SQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/new-api?charset=utf8mb4&parseTime=true&loc=Local"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: "false"
      NODE_NAME: new-api-preview-20261017
      NODE_TYPE: slave
      UPDATE_TASK: "false"
      CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED: "false"
      BATCH_UPDATE_ENABLED: "true"
      ERROR_LOG_ENABLED: "true"
      SQL_MAX_OPEN_CONNS: "15"
      SQL_MAX_IDLE_CONNS: "5"
      GOMEMLIMIT: 160MiB
      GOMAXPROCS: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks: [preview]
  mysql:
    image: mysql:8.4
    container_name: new-api-preview-mysql
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 384m
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=30", "--table-open-cache=256", "--temptable-max-ram=16M", "--innodb-redo-log-capacity=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: new-api
      TZ: Asia/Shanghai
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [preview]
  redis:
    image: redis:7-alpine
    container_name: new-api-preview-redis
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 64m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [preview]
networks:
  preview:
    name: new-api-preview-network
